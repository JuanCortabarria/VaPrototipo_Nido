document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* \u2014 navigation \u2014 */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* \u2014 tables \u2014 */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* \u2014 dialog \u2014 */\n.dialog-backdrop {\n  position: fixed; inset: 0; px\">Cancel<\/button>\n        <\/div>\n        <\/sc-if>\n\n        <!-- SHOPPING LIST SHEET -->\n        <sc-if value=\"{{ sheetShopping }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg,#faf6ee);border-radius:28px 28px 0 0;padding:12px 24px 34px;box-shadow:0 -12px 40px rgba(0,0,0,.22);animation:nidoUp .32s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto\" class=\"nido-scroll\">\n          <div style=\"width:40px;height:5px;border-radius:99px;background:var(--line,rgba(32,30,29,.18));margin:0 auto 16px\"><\/div>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n            <h2 style=\"font-size:24px;margin:0;color:var(--text,#201e1d)\">Shopping list<\/h2>\n            <button sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;background:var(--surface,#eee5d6);display:grid;place-items:center;color:var(--text,#201e1d)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M18 6L6 18M6 6l12 12\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\/path><\/svg><\/button>\n          <\/div>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ shoppingItems }}\" as=\"i\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:13px;background:var(--card,#fff);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.05))\">\n                <span style=\"width:38px;height:38px;border-radius:11px;background:{{ i.ownerTint }};display:grid;place-items:center;color:{{ i.ownerColor }};flex:none\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"2.5\" y=\"8\" width=\"19\" height=\"8\" rx=\"4\" transform=\"rotate(45 12 12)\" stroke=\"currentColor\" stroke-width=\"1.9\"><\/rect><path d=\"M8.7 8.7l6.6 6.6\" stroke=\"currentColor\" stroke-width=\"1.9\"><\/path><\/svg><\/span>\n                <div style=\"flex:1\"><div style=\"font-size:15px;font-weight:600;color:var(--text,#201e1d)\">{{ i.name }}<\/div><div style=\"font-size:12px;color:var(--muted,rgba(32,30,29,.55))\"><span style=\"color:{{ i.ownerColor }};font-weight:600\">{{ i.ownerName }}<\/span> \u00b7 {{ i.sub }}<\/div><\/div>\n                <button sc-camel-on-click=\"{{ i.remove }}\" style=\"width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:var(--surface,#f0e9dc);display:grid;place-items:center;color:var(--muted,#8a8375);flex:none\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M18 6L6 18M6 6l12 12\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\/path><\/svg><\/button>\n              <\/div>\n            <\/sc-for>\n            <sc-if value=\"{{ shoppingEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;padding:40px 20px;color:var(--muted,rgba(32,30,29,.5))\"><div style=\"font-size:15px\">Your list is empty.<\/div><div style=\"font-size:13px;margin-top:4px\">Tap \"Buy again\" on any low medication.<\/div><\/div>\n            <\/sc-if>\n          <\/div>\n          <sc-if value=\"{{ hasShopping }}\" hint-placeholder-val=\"{{ true }}\">\n          <button class=\"btn btn-primary btn-block\" style=\"height:52px;font-size:16px;margin-top:18px\">Order everything<\/button>\n          <button sc-camel-on-click=\"{{ clearShopping }}\" class=\"btn btn-block\" style=\"height:44px;color:var(--muted,#8a8375);margin-top:4px\">Clear list<\/button>\n          <\/sc-if>\n        <\/div>\n        <\/sc-if>\n\n        <!-- ADD MEDICATION SHEET -->\n        <sc-if value=\"{{ sheetAddMed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg,#faf6ee);border-radius:28px 28px 0 0;padding:12px 24px 34px;box-shadow:0 -12px 40px rgba(0,0,0,.22);animation:nidoUp .32s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto\" class=\"nido-scroll\">\n          <div style=\"width:40px;height:5px;border-radius:99px;background:var(--line,rgba(32,30,29,.18));margin:0 auto 16px\"><\/div>\n          <h2 style=\"font-size:24px;margin:0 0 18px;color:var(--text,#201e1d)\">Add medication<\/h2>\n          <div class=\"field\" style=\"margin-bottom:14px\"><label>Name<\/label><input class=\"input\" value=\"{{ amName }}\" sc-camel-on-input=\"{{ setAmName }}\" placeholder=\"e.g. Amoxicillin 500 mg\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <div style=\"display:flex;gap:12px;margin-bottom:18px\">\n            <div class=\"field\" style=\"flex:1\"><label>Quantity<\/label><input class=\"input\" value=\"{{ amQty }}\" sc-camel-on-input=\"{{ setAmQty }}\" placeholder=\"20\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n            <div class=\"field\" style=\"flex:1\"><label>Expiry<\/label><input class=\"input\" value=\"{{ amExpiry }}\" sc-camel-on-input=\"{{ setAmExpiry }}\" placeholder=\"Dec 2027\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <\/div>\n          <div style=\"font-size:12px;font-weight:700;color:var(--muted,rgba(32,30,29,.5));text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px\">Assign to<\/div>\n          <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px\">\n            <sc-for list=\"{{ amScopeChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ c.pick }}\" style=\"border:1.5px solid {{ c.border }};cursor:pointer;border-radius:99px;padding:9px 14px 9px 11px;display:inline-flex;align-items:center;gap:8px;background:{{ c.bg }};color:{{ c.color }}\"><span style=\"width:11px;height:11px;border-radius:50%;background:{{ c.dot }}\"><\/span><span style=\"font-size:13px;font-weight:600\">{{ c.label }}<\/span><\/button>\n            <\/sc-for>\n          <\/div>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveMed }}\" style=\"height:52px;font-size:16px\">Add to stock<\/button>\n          <button class=\"btn btn-block\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"height:44px;color:var(--muted,#8a8375);margin-top:4px\">Cancel<\/button>\n        <\/div>\n        <\/sc-if>\n\n        <!-- ADD MEMBER SHEET -->\n        <sc-if value=\"{{ sheetAddMember }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg,#faf6ee);border-radius:28px 28px 0 0;padding:12px 24px 34px;box-shadow:0 -12px 40px rgba(0,0,0,.22);animation:nidoUp .32s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto\" class=\"nido-scroll\">\n          <div style=\"width:40px;height:5px;border-radius:99px;background:var(--line,rgba(32,30,29,.18));margin:0 auto 16px\"><\/div>\n          <h2 style=\"font-size:24px;margin:0 0 6px;color:var(--text,#201e1d)\">Add family member<\/h2>\n          <p style=\"font-size:13px;color:var(--muted,rgba(32,30,29,.55));margin:0 0 18px\">They'll appear across your calendar, folders, stock and assistant.<\/p>\n          <div style=\"display:flex;justify-content:center;margin-bottom:18px\"><span style=\"width:66px;height:66px;border-radius:50%;background:{{ nmColor }};transition:.2s\"><\/span><\/div>\n          <div class=\"field\" style=\"margin-bottom:14px\"><label>Name<\/label><input class=\"input\" value=\"{{ nmName }}\" sc-camel-on-input=\"{{ setNmName }}\" placeholder=\"e.g. Elena\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <div class=\"field\" style=\"margin-bottom:18px\"><label>Relationship<\/label><input class=\"input\" value=\"{{ nmRel }}\" sc-camel-on-input=\"{{ setNmRel }}\" placeholder=\"e.g. Aunt\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <div style=\"font-size:12px;font-weight:700;color:var(--muted,rgba(32,30,29,.5));text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px\">Pick a color<\/div>\n          <div style=\"display:flex;gap:14px;margin-bottom:24px\">\n            <sc-for list=\"{{ nmSwatches }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ c.pick }}\" style=\"border:none;background:none;cursor:pointer;flex:1;display:grid;place-items:center;padding:0\"><span style=\"width:40px;height:40px;border-radius:50%;background:{{ c.color }};box-shadow:{{ c.ring }};transition:.2s\"><\/span><\/button>\n            <\/sc-for>\n          <\/div>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveMember }}\" style=\"height:52px;font-size:16px\">Add member<\/button>\n          <button class=\"btn btn-block\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"height:44px;color:var(--muted,#8a8375);margin-top:4px\">Cancel<\/button>\n        <\/div>\n        <\/sc-if>\n\n        <!-- ADD DOCUMENT SHEET -->\n        <sc-if value=\"{{ sheetAddDoc }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg,#faf6ee);border-radius:28px 28px 0 0;padding:12px 24px 34px;box-shadow:0 -12px 40px rgba(0,0,0,.22);animation:nidoUp .32s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto\" class=\"nido-scroll\">\n          <div style=\"width:40px;height:5px;border-radius:99px;background:var(--line,rgba(32,30,29,.18));margin:0 auto 16px\"><\/div>\n          <div style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:99px;background:{{ folderMemberTint }};margin-bottom:12px\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ folderMemberColor }}\"><\/span><span style=\"font-size:12.5px;font-weight:700;color:{{ folderMemberColor }}\">{{ folderMemberName }}<\/span><\/div>\n          <h2 style=\"font-size:24px;margin:0 0 18px;color:var(--text,#201e1d)\">Add document<\/h2>\n          <div class=\"field\" style=\"margin-bottom:14px\"><label>Title<\/label><input class=\"input\" value=\"{{ adName }}\" sc-camel-on-input=\"{{ setAdName }}\" placeholder=\"e.g. Blood test \u2014 CBC\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <div class=\"field\" style=\"margin-bottom:16px\"><label>Date performed<\/label><input class=\"input\" value=\"{{ adDate }}\" sc-camel-on-input=\"{{ setAdDate }}\" placeholder=\"e.g. 4 Aug 2026\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <button style=\"width:100%;border:1.5px dashed var(--line,rgba(32,30,29,.25));background:none;cursor:pointer;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted,#8a8375);margin-bottom:16px\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 16V4m0 0L8 8m4-4l4 4\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><path d=\"M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><\/path><\/svg>\n            <span style=\"font-size:13.5px;font-weight:600\">Attach a PDF or photo<\/span>\n          <\/button>\n          <div class=\"field\" style=\"margin-bottom:16px\"><label>Conclusion<\/label><input class=\"input\" value=\"{{ adConclusion }}\" sc-camel-on-input=\"{{ setAdConclusion }}\" placeholder=\"Short summary of the result\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <button sc-camel-on-click=\"{{ toggleAdConf }}\" style=\"width:100%;border:none;background:var(--card,#fff);cursor:pointer;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.05));margin-bottom:24px\">\n            <span style=\"width:34px;height:34px;border-radius:10px;background:var(--surface,#f0e9dc);color:var(--muted,#8a8375);display:grid;place-items:center;flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"9\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"1.9\"><\/rect><path d=\"M8 11V8a4 4 0 018 0v3\" stroke=\"currentColor\" stroke-width=\"1.9\"><\/path><\/svg><\/span>\n            <div style=\"flex:1;text-align:left\"><div style=\"font-size:14px;font-weight:600;color:var(--text,#201e1d)\">Confidential document<\/div><div style=\"font-size:12px;color:var(--muted,rgba(32,30,29,.55))\">Only you and {{ folderMemberName }} can see it<\/div><\/div>\n            <span style=\"width:46px;height:28px;border-radius:99px;position:relative;background:{{ adConfTrack }};flex:none\"><span style=\"position:absolute;top:2px;left:{{ adConfKnob }};width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s\"><\/span><\/span>\n          <\/button>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveDoc }}\" style=\"height:52px;font-size:16px\">Save to folder<\/button>\n          <button class=\"btn btn-block\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"height:44px;color:var(--muted,#8a8375);margin-top:4px\">Cancel<\/button>\n        <\/div>\n        <\/sc-if>\n\n        <!-- COMPANION SHEET -->\n        <sc-if value=\"{{ sheetCompanion }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg,#faf6ee);border-radius:28px 28px 0 0;padding:12px 24px 34px;box-shadow:0 -12px 40px rgba(0,0,0,.22);animation:nidoUp .32s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto\" class=\"nido-scroll\">\n          <div style=\"width:40px;height:5px;border-radius:99px;background:var(--line,rgba(32,30,29,.18));margin:0 auto 16px\"><\/div>\n          <div style=\"display:inline-flex;align-items:center;gap:8px;margin-bottom:12px\"><span style=\"width:36px;height:36px;border-radius:11px;background:#fff2eb;color:#c67139;display:grid;place-items:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M5 16V9l2-4h10l2 4v7M5 16h14M5 16v2M19 16v2\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><circle cx=\"8\" cy=\"16\" r=\"1.3\" fill=\"currentColor\"><\/circle><circle cx=\"16\" cy=\"16\" r=\"1.3\" fill=\"currentColor\"><\/circle><\/svg><\/span><span style=\"font-size:12.5px;font-weight:700;color:{{ companionMemberColor }}\">For {{ companionMemberName }}<\/span><\/div>\n          <h2 style=\"font-size:24px;margin:0 0 4px;color:var(--text,#201e1d)\">Transport &amp; companion<\/h2>\n          <p style=\"font-size:13px;color:var(--muted,rgba(32,30,29,.55));margin:0 0 18px\">A trusted driver \u2014 or someone to go along to the consultation.<\/p>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:18px\">\n            <sc-for list=\"{{ compLevels }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ l.pick }}\" style=\"text-align:left;border:1.5px solid {{ l.border }};cursor:pointer;background:var(--card,#fff);border-radius:16px;padding:14px;display:flex;align-items:flex-start;gap:12px\">\n                <span style=\"width:22px;height:22px;border-radius:50%;border:2px solid {{ l.border }};display:grid;place-items:center;flex:none;margin-top:1px\"><span style=\"width:11px;height:11px;border-radius:50%;background:{{ l.dot }}\"><\/span><\/span>\n                <div style=\"flex:1\"><div style=\"font-size:15px;font-weight:600;color:var(--text,#201e1d)\">{{ l.label }}<\/div><div style=\"font-size:12.5px;color:var(--muted,rgba(32,30,29,.55));margin-top:2px;line-height:1.4\">{{ l.desc }}<\/div><\/div>\n              <\/button>\n            <\/sc-for>\n          <\/div>\n          <div class=\"field\" style=\"margin-bottom:14px\"><label>Pickup time<\/label><input class=\"input\" value=\"{{ compPickup }}\" sc-camel-on-input=\"{{ setCompPickup }}\" placeholder=\"e.g. 9:15 AM\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <div class=\"field\" style=\"margin-bottom:24px\"><label>Notes for the driver<\/label><input class=\"input\" value=\"{{ compNotes }}\" sc-camel-on-input=\"{{ setCompNotes }}\" placeholder=\"e.g. Wheelchair access needed\" style=\"height:48px;background:var(--surface,#fff);color:var(--text,#201e1d);border-color:var(--line,rgba(32,30,29,.12))\"><\/div>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveCompanion }}\" style=\"height:52px;font-size:16px\">Request companion<\/button>\n          <button class=\"btn btn-block\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"height:44px;color:var(--muted,#8a8375);margin-top:4px\">Cancel<\/button>\n        <\/div>\n        <\/sc-if>\n\n        <!-- PERMISSIONS SHEET -->\n        <sc-if value=\"{{ sheetPerm }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg,#faf6ee);border-radius:28px 28px 0 0;padding:12px 24px 34px;box-shadow:0 -12px 40px rgba(0,0,0,.22);animation:nidoUp .32s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto\" class=\"nido-scroll\">\n          <div style=\"width:40px;height:5px;border-radius:99px;background:var(--line,rgba(32,30,29,.18));margin:0 auto 16px\"><\/div>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n            <div style=\"display:flex;align-items:center;gap:11px\"><span style=\"width:38px;height:38px;border-radius:50%;background:{{ permMemberColor }};flex:none\"><\/span><div><div style=\"font-size:18px;font-weight:600;color:var(--text,#201e1d)\">{{ permMemberName }}<\/div><div style=\"font-size:12px;color:var(--muted,rgba(32,30,29,.55))\">Access &amp; permissions<\/div><\/div><\/div>\n            <button sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;background:var(--surface,#eee5d6);display:grid;place-items:center;color:var(--text,#201e1d)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M18 6L6 18M6 6l12 12\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\/path><\/svg><\/button>\n          <\/div>\n          <div style=\"font-size:12px;font-weight:700;color:var(--muted,rgba(32,30,29,.5));text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px\">Who can access<\/div>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:6px\">\n            <div style=\"display:flex;align-items:center;gap:12px;background:var(--card,#fff);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.05))\">\n              <span style=\"width:34px;height:34px;border-radius:50%;background:#8a5a8f;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none\">S<\/span>\n              <div style=\"flex:1\"><div style=\"font-size:14.5px;font-weight:600;color:var(--text,#201e1d)\">Sof\u00eda \u00b7 Administrator<\/div><div style=\"font-size:12px;color:var(--muted,rgba(32,30,29,.55))\">Full access \u00b7 cannot be removed<\/div><\/div>\n            <\/div>\n            <sc-for list=\"{{ permGrants }}\" as=\"g\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;align-items:flex-start;gap:12px;background:var(--card,#fff);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.05))\">\n                <span style=\"width:34px;height:34px;border-radius:50%;background:{{ g.color }};color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none\">{{ g.initial }}<\/span>\n                <div style=\"flex:1;min-width:0\"><div style=\"font-size:14.5px;font-weight:600;color:var(--text,#201e1d)\">{{ g.name }} \u00b7 {{ g.role }}<\/div><div style=\"font-size:12px;color:var(--muted,rgba(32,30,29,.6))\">{{ g.scope }} \u00b7 {{ g.subs }}<\/div><div style=\"font-size:11px;color:var(--muted,rgba(32,30,29,.45));margin-top:2px\">Authorized {{ g.date }}<\/div><\/div>\n                <button sc-camel-on-click=\"{{ g.revoke }}\" style=\"border:none;cursor:pointer;background:#fbe4dc;color:#b0362a;border-radius:99px;padding:6px 12px;font-size:11.5px;font-weight:700;flex:none\">Revoke<\/button>\n              <\/div>\n            <\/sc-for>\n            <sc-if value=\"{{ permNoGrants }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;padding:18px;color:var(--muted,rgba(32,30,29,.5));font-size:13px\">No one else has been granted access.<\/div>\n            <\/sc-if>\n          <\/div>\n          <button sc-camel-on-click=\"{{ permGrantAction }}\" style=\"width:100%;border:1.5px dashed var(--line,rgba(32,30,29,.2));background:none;cursor:pointer;border-radius:16px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;color:#c67139;margin-bottom:22px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\/path><\/svg><span style=\"font-size:14px;font-weight:600\">Grant access to someone<\/span><\/button>\n          <div style=\"font-size:12px;font-weight:70
